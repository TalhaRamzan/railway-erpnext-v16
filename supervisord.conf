; supervisord config for the single ERPNext container.
;
; Process commands mirror upstream frappe_docker (compose.yaml / pwd.yml and
; resources/core/start.sh), with two changes:
;   * gunicorn and socket.io listen on 127.0.0.1 only; nginx is the single
;     public entrypoint on $PORT.
;   * one combined queue worker (long,default,short) instead of two, to keep
;     RAM low. Add more workers by copying [program:erpnext-worker].
;
; %(ENV_X)s values are exported (with defaults) by railway-entrypoint.sh.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
; frappe user is in group 0, so restore.sh (running as frappe) can use supervisorctl
chmod=0770
chown=root:root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:erpnext-web]
command=/home/frappe/frappe-bench/env/bin/gunicorn
    --chdir=/home/frappe/frappe-bench/sites
    --bind=127.0.0.1:8000
    --threads=%(ENV_GUNICORN_THREADS)s
    --workers=%(ENV_GUNICORN_WORKERS)s
    --worker-class=gthread
    --worker-tmp-dir=/dev/shm
    --timeout=%(ENV_GUNICORN_TIMEOUT)s
    --max-requests=%(ENV_GUNICORN_MAX_REQUESTS)s
    --max-requests-jitter=%(ENV_GUNICORN_MAX_REQUESTS_JITTER)s
    --forwarded-allow-ips=127.0.0.1
    --preload
    frappe.app:application
directory=/home/frappe/frappe-bench
user=frappe
environment=HOME="/home/frappe",USER="frappe"
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:erpnext-socketio]
command=node /home/frappe/frappe-bench/apps/frappe/socketio.js
directory=/home/frappe/frappe-bench
user=frappe
environment=HOME="/home/frappe",USER="frappe"
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:erpnext-worker]
command=bench worker --queue %(ENV_WORKER_QUEUES)s
directory=/home/frappe/frappe-bench
user=frappe
environment=HOME="/home/frappe",USER="frappe"
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=10
; give a running job time to finish on redeploy
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:erpnext-scheduler]
command=bench schedule
directory=/home/frappe/frappe-bench
user=frappe
environment=HOME="/home/frappe",USER="frappe"
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:erpnext-nginx]
; Own main config (rendered by the entrypoint): logs go to the inherited
; stderr fd instead of re-opening /dev/stdout, which fails for non-root.
command=nginx -c /etc/nginx/railway.conf -g "daemon off;"
user=frappe
environment=HOME="/home/frappe",USER="frappe"
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:erpnext-backup]
; Nightly backup loop. Sleeps forever when BACKUP_ENABLED=false.
command=/usr/local/bin/backup.sh --daemon
directory=/home/frappe/frappe-bench
user=frappe
environment=HOME="/home/frappe",USER="frappe"
priority=50
autostart=true
autorestart=true
startsecs=3
startretries=10
; let an in-flight backup finish if possible
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[eventlistener:watchdog]
; If any program ends up FATAL (keeps crashing), stop supervisord so the
; container exits and Railway restarts it (restart policy: Always). The
; entrypoint then waits for MariaDB/Redis again before starting processes.
command=/usr/local/bin/supervisor-watchdog.sh
events=PROCESS_STATE_FATAL
priority=1
autostart=true
autorestart=true
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
