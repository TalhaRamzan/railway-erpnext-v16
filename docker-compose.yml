# LOCAL TESTING ONLY. Mirrors the Railway layout exactly:
#   mariadb  -> Railway service "MariaDB"  (built from ./mariadb, volume /var/lib/mysql)
#   redis    -> Railway service "Redis"    (password-protected, like Railway's Redis)
#   erpnext  -> Railway service "ERPNext"  (built from ., ONE volume on sites/)
#
#   cp .env.example .env   # then fill in the passwords
#   docker compose up --build
#   open http://localhost:8080  (first boot takes 3-10 min while the site is created)

name: erpnext-v16

services:
  mariadb:
    build: ./mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:8.6.8-alpine@sha256:91c71f9ea78fa3fe268ff832a985c48e592244f707993773f8b3e1b244ac1137
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "60", "1", "--dir", "/data"]
    volumes:
      - redis-data:/data

  erpnext:
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${LOCAL_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      SITE_NAME: ${SITE_NAME:-erp.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      # Local runs are plain http, so don't trust X-Forwarded-Proto.
      TRUST_UPSTREAM_FORWARDED_PROTO: "off"
      FRAPPE_HOST_NAME: ${FRAPPE_HOST_NAME:-http://localhost:8080}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-3}
      BACKUP_WITH_FILES: ${BACKUP_WITH_FILES:-true}
      BACKUP_S3_REPOSITORY: ${BACKUP_S3_REPOSITORY:-}
      BACKUP_S3_PASSWORD: ${BACKUP_S3_PASSWORD:-}
      BACKUP_S3_KEEP: ${BACKUP_S3_KEEP:-14}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/method/ping"]
      start_period: 900s
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - sites:/home/frappe/frappe-bench/sites

volumes:
  db-data:
  redis-data:
  sites:
